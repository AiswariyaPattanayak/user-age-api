services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on first start only: creates the users table
      - ./db/migrations/000001_create_users_table.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: "3000"
      APP_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/usersdb?sslmode=disable
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
